version: '3.8'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/app/data  # Mount the data directory for SQLite databases
      - .:/app  # Mount the entire project for development
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}  # Discord bot token from .env file
      - TZ=UTC  # Set timezone
    restart: unless-stopped
    command: ["uv", "run", "bot.py"]  # Run the bot module

volumes:
  data:  # Named volume for persistent data storage 